<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <h1>Employee Management System</h1>


        <!-- SEARCH FORM -->
        <form action="/search" method="POST" class="search-form">

            <input type="text"
                name="search"
                placeholder="Search Employee">

            <button type="submit">
                Search
            </button>

        </form>


        <!-- ADD EMPLOYEE FORM -->
        <div class="form-container">

            <h2>Add Employee</h2>

            <form action="/add" method="POST">

                <input type="text"
                    name="name"
                    placeholder="Enter Employee Name"
                    required>

                <input type="text"
                    name="designation"
                    placeholder="Enter Designation"
                    required>

                <input type="number"
                    name="salary"
                    placeholder="Enter Salary"
                    required>

                <button type="submit">
                    Add Employee
                </button>

            </form>

        </div>


        <!-- TOTAL EMPLOYEES -->
        <div class="total-box">

            <h2>
                Total Employees :
                {{ employees|length }}
            </h2>

        </div>


        <!-- EMPLOYEE LIST -->
        <div class="employee-list">

            {% for emp in employees %}

            <div class="card">

                <h2>{{ emp[0] }}</h2>

                <p>
                    <strong>Designation:</strong>
                    {{ emp[1] }}
                </p>

                <p>
                    <strong>Salary:</strong>
                    ₹ {{ emp[2] }}
                </p>


                <!-- UPDATE FORM -->
                <form action="/update/{{ emp[0] }}"
                    method="POST">

                    <input type="text"
                        name="designation"
                        placeholder="New Designation"
                        required>

                    <input type="number"
                        name="salary"
                        placeholder="New Salary"
                        required>

                    <button type="submit">
                        Update
                    </button>

                </form>


                <!-- DELETE BUTTON -->
                <a href="/delete/{{ emp[0] }}">

                    <button class="delete-btn">
                        Delete
                    </button>

                </a>

            </div>

            {% endfor %}

        </div>

    </div>

</body>

</html>
